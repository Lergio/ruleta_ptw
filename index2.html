    :root{

      padding-bottom:env(safe-area-inset-bottom,0px);

      --font-display:"Dela Gothic One","Arial Black","Helvetica Neue",Arial,sans-serif;
      --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Segoe UI",Roboto,Arial,sans-serif;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#14121F; --surface:#201C33; --ink:#F2EEF8; --muted:#A79FC0; --line:#382F55;

      }
    }
    :root[data-theme="dark"]{
      --bg:#14121F; --surface:#201C33; --ink:#F2EEF8; --muted:#A79FC0; --line:#382F55;

    }
    html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
    *,*::before,*::after{box-sizing:inherit}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:var(--font-body); font-size:16px; line-height:1.5;
      min-height:100vh;
    }
    .page{max-width:1040px;margin:0 auto;padding:28px 20px 48px}
    header{margin-bottom:28px}
    h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
    .count{margin:0;color:var(--muted)}
    .app{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start}
    @media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);gap:24px}}

    .wheel-wrap{position:relative;width:100%;max-width:480px;margin:0 auto;aspect-ratio:1/1}
    .wheel-wrap canvas{width:100%;height:100%;display:block}
    .pointer{
      position:absolute;left:50%;top:-4px;transform:translateX(-50%);z-index:2;
      width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
      border-top:30px solid var(--accent);
      filter:drop-shadow(0 2px 0 var(--rim));
    }

    .panel{display:flex;flex-direction:column;gap:22px}
    .result{
      background:var(--surface);border:2px solid var(--line);border-radius:14px;
      padding:22px 22px 20px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:14px;
    }
    .result .placeholder{margin:0;color:var(--muted)}
    .result h2{
      font-family:var(--font-display);font-weight:400;margin:0;
      font-size:clamp(1.4rem,3.4vw,2.1rem);line-height:1.2;overflow-wrap:anywhere;
    }
    .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
    .badge{
      font-weight:700;font-size:.95rem;padding:3px 12px;border-radius:999px;
      background:var(--accent);color:var(--on-accent);
    }
    .eps{color:var(--muted)}
    .hold{margin:0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
    .result.pop h2,.result.pop .meta{animation:reveal .35s ease-out both}
    @keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    .actions{display:flex;flex-wrap:wrap;gap:10px}
    button{font:inherit;cursor:pointer}
    .btn{
      border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);
      font-weight:700;font-size:1.1rem;padding:12px 30px;border-radius:12px;
    }
    .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-size:1rem;padding:12px 18px;font-weight:500}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn:not(:disabled):hover{filter:brightness(1.07)}
    :focus-visible{outline:3px solid var(--ink);outline-offset:3px}

    fieldset{border:0;margin:0;padding:0}
    legend{padding:0;margin-bottom:8px;font-weight:700}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      border:2px solid var(--line);background:transparent;color:var(--muted);
      padding:5px 12px;border-radius:999px;font-size:.92rem;
    }
    .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--surface);font-weight:700}
    .chip .n{opacity:.7;font-weight:400;margin-left:4px}

    .history h3{margin:0;font-size:1rem}
    .hhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
    .history ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
    .history li{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.93rem;border-bottom:1px solid var(--line);padding-bottom:4px}
    .history li span:first-child{overflow-wrap:anywhere}
    .history li span:last-child{white-space:nowrap}
    .link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.93rem;text-align:left}
    .link:hover{color:var(--ink)}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @media (prefers-reduced-motion: reduce){.result.pop h2,.result.pop .meta{animation:none}}
    </style>
  </head>
  <body>
  <div class="page">
    <header>
      <h1>¿Qué anime empiezo?</h1>
      <p class="count" id="count"></p>
    </header>

    <main class="app">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Ruleta con animes pendientes"></canvas>
      </div>

      <div class="panel">
        <section class="result" id="result" aria-live="polite">
          <p class="placeholder">Todavía no giraste. Toca Girar y la ruleta elige por ti.</p>
        </section>

        <div class="actions">
          <button class="btn" id="spin" type="button">Girar</button>
          <button class="btn ghost" id="started" type="button" hidden>Ya lo empecé</button>
          <button class="btn ghost" id="redo" type="button" hidden>Borrar y girar de nuevo</button>
        </div>

        <fieldset>
          <legend>Qué incluir</legend>
          <div class="chips" id="modes"></div>
        </fieldset>

        <fieldset>
          <legend>Tipos</legend>
          <div class="chips" id="chips"></div>
        </fieldset>

        <div class="history" id="history" hidden>
          <div class="hhead">
            <h3>Tiradas anteriores</h3>
            <button class="link" id="clearHistory" type="button">Limpiar lista</button>
          </div>
          <ol id="historyList"></ol>
        </div>

        <button class="link" id="restore" type="button" hidden></button>
      </div>
    </main>
  </div>

,"w":0},{"t":"Yamada-kun to Lv999 no Koi wo Suru","y":"TV","e":13,"w":0},{"t":"Yesterday wo Utatte","y":"TV","e":12,"w":0},{"t":"Yofukashi no Uta","y":"TV","e":13,"w":0},{"t":"Yomi no Tsugai 2nd Season","y":"TV","e":0,"w":0},{"t":"Youjo Senki","y":"TV","e":12,"w":0},{"t":"Youkoso Jitsuryoku Shijou Shugi no Kyoushitsu e 2nd Season","y":"TV","e":13,"w":2},{"t":"Yuru Camp△ Season 2","y":"TV","e":13,"w":0},{"t":"Yuusha-kei ni Shosu: Choubatsu Yuusha 9004-tai Keimu Kiroku","y":"TV","e":12,"w":0},{"t":"Zenshuu.","y":"TV","e":12,"w":0},{"t":"Zero no Tsukaima","y":"TV","e":13,"w":0},{"t":"Zom 100: Zombie ni Naru made ni Shitai 100 no Koto","y":"TV","e":12,"w":0},{"t":"Zombieland Saga Revenge","y":"TV","e":12,"w":0}];
  const STORE = "ptw-empezados";
  const PALETTE = ["#8C9BFF","#4FD1C1","#FF8F85","#FFC95C","#C3A9F5"];
  const MAX_SEGS = 12;

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let started = new Set();
  try { started = new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch (e) {}
  function saveStarted(){ try { localStorage.setItem(STORE, JSON.stringify([...started])); } catch (e) {} }

  const types = [...new Set(ALL.map(a => a.y))].sort((a,b) =>
    ALL.filter(x => x.y === b).length - ALL.filter(x => x.y === a).length);
  const active = new Set(types);

  let segs = [], rot = Math.random() * Math.PI * 2, spinning = false, current = null, history = [];

  let mode = "todos";
  const inMode = a => mode === "todos" || (mode === "espera" ? a.w > 0 : a.w === 0);
  const pool = () => ALL.filter(a => active.has(a.y) && inMode(a) && !started.has(a.t));
  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const mod = (x, m) => ((x % m) + m) % m;

  /* ---------- wheel drawing ---------- */
  function fitLabel(name, type, maxW){
    const suffix = "  ·  " + type;
    if (ctx.measureText(name + suffix).width <= maxW) return name + suffix;
    let t = name;
    while (t.length > 1 && ctx.measureText(t + "…" + suffix).width > maxW) t = t.slice(0, -1);
    return t.trimEnd() + "…" + suffix;
  }
  function draw(){
    const size = canvas.clientWidth; if (!size) return;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(size * dpr)){ canvas.width = canvas.height = Math.round(size * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const cs = getComputedStyle(document.documentElement);
    const rimC = cs.getPropertyValue("--rim").trim(), hubC = cs.getPropertyValue("--hub").trim(), lamp = cs.getPropertyValue("--lamp").trim();
    const c = size / 2, R = c - 8, r = R * 0.93;

    ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fillStyle = rimC; ctx.fill();

    const n = segs.length;
    if (!n){
      ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fillStyle = hubC; ctx.fill();
      return;
    }
    const a = Math.PI * 2 / n;
    const fs = Math.max(11, R * 0.058);
    ctx.font = `700 ${fs}px "Zen Kaku Gothic New", "Segoe UI", Arial, sans-serif`;
    ctx.textBaseline = "middle";
    for (let i = 0; i < n; i++){
      const s = rot + i * a;
      let col = i % PALETTE.length;
      if (i === n - 1 && n > 1 && col === 0) col = 2;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, s, s + a); ctx.closePath();
      ctx.fillStyle = PALETTE[col]; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = rimC; ctx.stroke();

      ctx.save(); ctx.translate(c, c); ctx.rotate(s + a / 2);
      ctx.textAlign = "right"; ctx.fillStyle = "#1A1526";
      const avail = r - 14 - R * 0.2;
      ctx.fillText(fitLabel(segs[i].t, segs[i].y, avail), r - 14, 0);
      ctx.restore();
    }
    const dots = Math.max(24, n * 2);
    for (let i = 0; i < dots; i++){
      const ang = rot + i * (Math.PI * 2 / dots);
      ctx.beginPath(); ctx.arc(c + Math.cos(ang) * (R + r) / 2, c + Math.sin(ang) * (R + r) / 2, Math.max(2, R * 0.011), 0, Math.PI * 2);
      ctx.fillStyle = lamp; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(c, c, R * 0.13, 0, Math.PI * 2);
    ctx.fillStyle = hubC; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = rimC; ctx.stroke();
  }
  function idleWheel(){
    segs = shuffle(pool()).slice(0, MAX_SEGS);
    draw();
  }

  /* ---------- UI ---------- */
  function renderCount(){
    const p = pool().length;
    $("count").textContent = `${p} de ${ALL.length} animes en la ruleta`;
    const rs = $("restore");
    if (started.size){ rs.hidden = false; rs.textContent = `Restaurar los ${started.size} que ya saqué`; } else rs.hidden = true;
    $("spin").disabled = spinning || p === 0;
  }
  function renderChips(){
    const box = $("chips"); box.textContent = "";
    types.forEach(t => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", active.has(t));
      const label = document.createTextNode(t);
      const n = document.createElement("span"); n.className = "n";
      n.textContent = ALL.filter(a => a.y === t && inMode(a) && !started.has(a.t)).length;
      b.append(label, n);
      b.addEventListener("click", () => {
        if (spinning) return;
        active.has(t) ? active.delete(t) : active.add(t);
        b.setAttribute("aria-pressed", active.has(t));
        afterPoolChange();
      });
      box.appendChild(b);
    });
  }
  const MODES = [["todos","Todos"],["nuevos","Sin empezar"],["espera","En espera"]];
  function renderModes(){
    const box = $("modes"); box.textContent = "";
    MODES.forEach(([k, label]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", mode === k);
      b.append(document.createTextNode(label));
      const n = document.createElement("span"); n.className = "n";
      n.textContent = ALL.filter(a => (k === "todos" || (k === "espera" ? a.w > 0 : a.w === 0)) && active.has(a.y) && !started.has(a.t)).length;
      b.appendChild(n);
      b.addEventListener("click", () => { if (spinning) return; mode = k; afterPoolChange(); });
      box.appendChild(b);
    });
  }
  function afterPoolChange(){
    renderModes();
    renderCount(); renderChips(); idleWheel();
    if (!pool().length && !current){
      $("result").innerHTML = ""; const p = document.createElement("p"); p.className = "placeholder";
      p.textContent = "No quedan animes con estos filtros. Activa otro tipo o restaura la lista."; $("result").appendChild(p);
    }
  }
  function showResult(a){
    const box = $("result"); box.textContent = "";
    box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
    const h = document.createElement("h2"); h.textContent = a.t;
    const meta = document.createElement("div"); meta.className = "meta";
    const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = a.y;
    const eps = document.createElement("span"); eps.className = "eps";
    eps.textContent = a.e > 0 ? `${a.e} ${a.e === 1 ? "episodio" : "episodios"}` : "Episodios sin definir";
    meta.append(badge, eps);
    box.append(h, meta);
    if (a.w > 0){
      const hold = document.createElement("p"); hold.className = "hold";
      hold.textContent = a.e > 0
        ? `En espera: viste ${a.w} de ${a.e}. Retomá desde el episodio ${Math.min(a.w + 1, a.e)}.`
        : `En espera: viste ${a.w} episodios. Retomá desde el episodio ${a.w + 1}.`;
      box.appendChild(hold);
    }
    updateStartedBtn();
  }
  function updateStartedBtn(){
    const b = $("started");
    $("redo").hidden = !current;
    if (!current){ b.hidden = true; return; }
    b.hidden = false;
    b.textContent = started.has(current.t) ? "Deshacer: volver a la ruleta" : (current.w > 0 ? "Ya lo retomé" : "Ya lo empecé");
  }
  function renderHistory(){
    $("history").hidden = history.length === 0;
    const ol = $("historyList"); ol.textContent = "";
    history.slice(0, 10).forEach(a => {
      const li = document.createElement("li");
      const s1 = document.createElement("span"); s1.textContent = a.t;
      const s2 = document.createElement("span"); s2.textContent = a.y;
      li.append(s1, s2); ol.appendChild(li);
    });
  }

  /* ---------- spin ---------- */
  function spin(){
    if (spinning) return;
    const p = pool(); if (!p.length) return;
    const winner = p[Math.floor(Math.random() * p.length)];
    const n = Math.min(MAX_SEGS, p.length);
    const others = shuffle(p.filter(x => x !== winner)).slice(0, n - 1);
    const w = Math.floor(Math.random() * n);
    others.splice(w, 0, winner); segs = others;

    const a = Math.PI * 2 / n;
    const desired = -Math.PI / 2 - (w * a + a / 2) + (Math.random() - 0.5) * a * 0.7;
    const turns = 5 + Math.floor(Math.random() * 3);
    const from = rot, to = rot + mod(desired - rot, Math.PI * 2) + turns * Math.PI * 2;

    spinning = true; $("redo").disabled = true; $("spin").disabled = true; $("spin").textContent = "Girando…";
    const finish = () => {
      rot = mod(to, Math.PI * 2); draw(); spinning = false; $("redo").disabled = false;
      current = winner; history.unshift(winner);
      $("spin").textContent = "Girar de nuevo";
      showResult(winner); renderHistory(); renderCount();
    };
    if (reduceMotion()){ rot = to; finish(); return; }
    const t0 = performance.now(), dur = 5200;
    (function frame(now){
      const k = Math.min(1, (now - t0) / dur);
      rot = from + (to - from) * (1 - Math.pow(1 - k, 4));
      draw();
      k < 1 ? requestAnimationFrame(frame) : finish();
    })(t0);
  }

  $("spin").addEventListener("click", spin);
  $("redo").addEventListener("click", () => {
    if (spinning || !current) return;
    const i = history.indexOf(current);
    if (i !== -1) history.splice(i, 1);
    renderHistory();
    spin();
  });
  $("clearHistory").addEventListener("click", () => { history = []; renderHistory(); });
  $("started").addEventListener("click", () => {
    if (!current) return;
    started.has(current.t) ? started.delete(current.t) : started.add(current.t);
    saveStarted(); updateStartedBtn(); renderCount(); renderChips();
    if (!spinning) idleWheel();
  });
  $("restore").addEventListener("click", () => {
    started.clear(); saveStarted(); updateStartedBtn(); renderCount(); renderChips(); idleWheel();
  });

  window.addEventListener("resize", draw);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  renderModes(); renderCount(); renderChips(); idleWheel();
  </script>
